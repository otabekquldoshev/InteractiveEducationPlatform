services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: eduaccess
      POSTGRES_USER: eduaccess
      POSTGRES_PASSWORD: eduaccess
    ports:
      - "5432:5432"
    volumes:
      - eduaccess_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eduaccess -d eduaccess"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  eduaccess_postgres:
